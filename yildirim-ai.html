<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yıldırım AI Galeri</title>

<style>
*{box-sizing:border-box;}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#080808;
    color:#fff;
}

.header{
    background:linear-gradient(135deg,#111,#1b1608);
    padding:25px 18px;
    border-bottom:2px solid #d4af37;
}

.logo{
    font-size:27px;
    font-weight:bold;
    color:#d4af37;
}

.alt{
    color:#aaa;
    margin-top:6px;
    font-size:14px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:18px;
}

.menu{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:18px;
}

.menu button{
    padding:15px 8px;
    border:1px solid #444;
    border-radius:12px;
    background:#151515;
    color:#fff;
    font-weight:bold;
}

.menu button.active{
    background:#d4af37;
    color:#000;
}

.panel{
    background:#111;
    border:1px solid #333;
    border-radius:16px;
    padding:18px;
    margin-bottom:18px;
}

h2{
    color:#d4af37;
    margin-top:0;
}

label{
    display:block;
    margin-top:14px;
    margin-bottom:6px;
    color:#ccc;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #444;
    background:#1b1b1b;
    color:#fff;
    font-size:16px;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.ai-button{
    width:100%;
    margin-top:22px;
    padding:17px;
    border:0;
    border-radius:12px;
    background:#d4af37;
    color:#000;
    font-size:17px;
    font-weight:bold;
}

.ai-button:disabled{
    opacity:.6;
}

.sonuc{
    display:none;
    margin-top:20px;
    padding:18px;
    border-radius:14px;
    background:#171717;
    border:1px solid #d4af37;
}

.karar{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    color:#d4af37;
    margin-bottom:15px;
}

.analiz{
    white-space:pre-wrap;
    line-height:1.6;
    color:#eee;
}

.hata{
    color:#ff7777;
    background:#2a1111;
    padding:12px;
    border-radius:10px;
    margin-top:15px;
}

@media(max-width:600px){
    .menu{
        grid-template-columns:1fr;
    }

    .row{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">⚡ YILDIRIM AI</div>
    <div class="alt">Yıldırım Oto Galeri • Alım Satım Asistanı</div>
</div>

<div class="container">

    <div class="menu">
        <button class="active">🚗 Araç</button>
        <button>🏠 Ev</button>
        <button>🌳 Arsa</button>
    </div>

    <div class="panel">

        <h2>🚗 Araç Analizi</h2>

        <label>Marka</label>
        <input type="text" id="marka" placeholder="Örn: BMW">

        <label>Model</label>
        <input type="text" id="model" placeholder="Örn: 320i M Sport">

        <div class="row">

            <div>
                <label>Model Yılı</label>
                <input type="number" id="yil" placeholder="2020">
            </div>

            <div>
                <label>Kilometre</label>
                <input type="number" id="km" placeholder="85000">
            </div>

        </div>

        <label>Şehir</label>
        <input type="text" id="sehir" placeholder="Örn: İstanbul">

        <label>Araç için istenen fiyat</label>
        <input type="number" id="istenen" placeholder="1550000">

        <label>Donanım / Paket</label>
        <input type="text" id="paket" placeholder="Örn: M Sport">

        <label>Ekspertiz masrafı</label>
        <input type="number" id="ekspertiz" value="5000">

        <label>Noter masrafı</label>
        <input type="number" id="noter" value="2000">

        <label>Diğer masraflar</label>
        <input type="number" id="diger" value="5000">

        <label>Minimum istediğim kâr</label>
        <input type="number" id="minimumKar" value="150000">

        <button class="ai-button" id="analizButton" onclick="analizEt()">
            ⚡ YILDIRIM AI İLE ANALİZ ET
        </button>

        <div class="sonuc" id="sonuc">

            <div class="karar">
                ⚡ YILDIRIM AI ANALİZ SONUCU
            </div>

            <div class="analiz" id="analizMetni"></div>

        </div>

    </div>

</div>

<script>

const API_URL = "https://yildirim-ai-backend.onrender.com/api/analyze";

async function analizEt(){

    const marka = document.getElementById("marka").value.trim();
    const model = document.getElementById("model").value.trim();
    const yil = document.getElementById("yil").value;
    const km = document.getElementById("km").value;
    const sehir = document.getElementById("sehir").value.trim();
    const istenen = document.getElementById("istenen").value;
    const paket = document.getElementById("paket").value.trim();

    const ekspertiz =
        document.getElementById("ekspertiz").value || 0;

    const noter =
        document.getElementById("noter").value || 0;

    const diger =
        document.getElementById("diger").value || 0;

    const minimumKar =
        document.getElementById("minimumKar").value || 0;

    const sonuc = document.getElementById("sonuc");
    const analizMetni = document.getElementById("analizMetni");
    const buton = document.getElementById("analizButton");

    if(!marka || !model || !yil || !km || !istenen){

        alert("Lütfen marka, model, model yılı, kilometre ve istenen fiyatı gir.");

        return;
    }

    buton.disabled = true;
    buton.innerText = "⚡ YILDIRIM AI ANALİZ EDİYOR...";

    sonuc.style.display = "block";

    analizMetni.innerText =
        "Yıldırım AI sunucuya bağlanıyor...\n\n" +
        "Araç bilgileri analiz ediliyor...";

    try{

        const cevap = await fetch(API_URL, {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                marka: marka,
                model: model,
                yil: yil,
                km: km,
                sehir: sehir,
                istenen: istenen,
                paket: paket,
                ekspertiz: ekspertiz,
                noter: noter,
                diger: diger,
                minimumKar: minimumKar

            })

        });

        const veri = await cevap.json();

        if(!cevap.ok || !veri.success){

            throw new Error(
                veri.error || "Sunucudan cevap alınamadı."
            );

        }

        analizMetni.innerText = veri.analysis;

    }

    catch(hata){

        analizMetni.innerHTML =
            '<div class="hata">' +
            '❌ HATA<br><br>' +
            hata.message +
            '</div>';

    }

    finally{

        buton.disabled = false;

        buton.innerText =
            "⚡ YILDIRIM AI İLE ANALİZ ET";

    }

}

</script>

</body>
</html>
